services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: mrm_academy
    ports: ["5432:5432"]
    volumes: [academy-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U academy -d mrm_academy"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  academy-db:
